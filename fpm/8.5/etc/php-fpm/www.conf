[www]

user = www-data
group = www-data

; Unix socket - faster than TCP for same-host communication
listen = /var/run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Pass host environment variables through to PHP scripts
clear_env = no

; Sized for 4 CPUs / 4GB, database and Redis off-host - see README
pm = dynamic
pm.max_children = 24
pm.start_servers = 8
pm.min_spare_servers = 6
pm.max_spare_servers = 12
pm.max_requests = 500

; Pool metrics - not reachable via Apache, the vhost only proxies .php
pm.status_path = /fpm-status

; Log slow requests (> 10s) to help spot Flarum bottlenecks
slowlog = /var/log/php-fpm-slow.log
request_slowlog_timeout = 10s

; Backstop for workers blocked in I/O, where max_execution_time does not tick
request_terminate_timeout = 310s
