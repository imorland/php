; -------------------------------------
; FLARUM PRODUCTION configuration
; -------------------------------------

display_errors = 0

short_open_tag    = On
variables_order   = 'GPCS'
request_order     = 'GP'

allow_url_fopen   = On
allow_url_include = Off

memory_limit        = 256M
max_execution_time  = 300
max_input_time      = 300
post_max_size       = 50M
upload_max_filesize = 50M
max_input_vars      = 5000

expose_php          = Off

date.timezone = Europe/London

mysql.default_host = mysql
mysqli.default_host = mysql

; Zend OPCache - tuned for Flarum
; Flarum + extensions load a large number of files via Composer autoloader
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
; Rounds up to the next prime in a fixed set - 20000 gives 32531 slots
opcache.max_accelerated_files = 20000
opcache.fast_shutdown = 1
opcache.enable_cli = 1

; The 5% default is too low to trigger a restart, leaving scripts uncached
opcache.max_wasted_percentage = 10

; Production: disable timestamp validation for maximum performance.
; Restart PHP-FPM to pick up code changes after deploys.
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; Tracing JIT (= 1254). Flarum's per-request cost is framework boot, reflection
; and JSON serialization, none of which JIT accelerates - expect no measurable gain.
; Buffer is allocated on top of memory_consumption: 256M + 64M = 320M reserved.
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; XDebug (disabled in production)
xdebug.remote_enable           = 0
xdebug.remote_connect_back     = off
