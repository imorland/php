# Sized to the FPM pool in etc/php-fpm/www.conf - see README.
# Debian's default of 150 lets Apache accept ~6x what PHP can serve, leaving the
# surplus in the FCGI queue for up to Timeout (300s).
# Idle keep-alive connections stay on the listener thread, so the parallel API
# connections of a Flarum client do not pin worker threads.
<IfModule mpm_event_module>
	StartServers			 2
	ServerLimit			  2
	ThreadLimit			 64
	ThreadsPerChild		 25
	MaxRequestWorkers	    50
	MinSpareThreads		 25
	MaxSpareThreads		 50
	MaxConnectionsPerChild  10000
</IfModule>
