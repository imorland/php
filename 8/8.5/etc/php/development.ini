; -------------------------------------
; DEVELOPMENT configuration
; -------------------------------------

; this file will overwrite default php.ini settings

display_errors = 1

short_open_tag    = On
variables_order   = 'GPCS'
request_order     = 'GP'

allow_url_fopen   = On
allow_url_include = Off

memory_limit        = 512M
max_execution_time  = 900
max_input_time      = 300
post_max_size       = 50M
upload_max_filesize = 50M
max_input_vars      = 5000

expose_php          = Off

; Temporary mitigation for CVE-2026-109618 / CVE-2026-109619 until patched
; PHP releases are out. Flarum does not use session upload progress.
session.upload_progress.enabled = Off

date.timezone = Europe/London

mysql.default_host = mysql
mysqli.default_host = mysql

; Zend OPCache
opcache.enable = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.fast_shutdown = 1
opcache.enable_cli = 1
opcache.revalidate_freq = 0
