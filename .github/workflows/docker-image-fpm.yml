name: Docker Image CI - FPM

on:
  workflow_dispatch:

jobs:
  # Build apache and cli images on native runners for each arch
  build_apache:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            image: php83fpm
            arch: amd64
            runner: ubuntu-latest
          - php: '8.3'
            image: php83fpm
            arch: arm64
            runner: ubuntu-24.04-arm
          - php: '8.5'
            image: php85fpm
            arch: amd64
            runner: ubuntu-latest
          - php: '8.5'
            image: php85fpm
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    - name: Build and Push
      run: |
        docker buildx build . \
          --progress=plain \
          --platform linux/${{ matrix.arch }} \
          --file fpm/${{ matrix.php }}/Dockerfile.apache \
          --tag ianmgg/${{ matrix.image }}:latest-${{ matrix.arch }} \
          --push

  build_cli:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            image: php83fpm
            arch: amd64
            runner: ubuntu-latest
          - php: '8.3'
            image: php83fpm
            arch: arm64
            runner: ubuntu-24.04-arm
          - php: '8.5'
            image: php85fpm
            arch: amd64
            runner: ubuntu-latest
          - php: '8.5'
            image: php85fpm
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    - name: Build and Push
      run: |
        docker buildx build . \
          --progress=plain \
          --platform linux/${{ matrix.arch }} \
          --file fpm/${{ matrix.php }}/Dockerfile.cli \
          --tag ianmgg/${{ matrix.image }}:cli-${{ matrix.arch }} \
          --push

  # Merge arch-specific tags into multi-arch manifests
  merge_base_manifests:
    needs: [build_apache, build_cli]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: php83fpm
          - image: php85fpm
    steps:
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Create manifests
      run: |
        docker buildx imagetools create \
          --tag ianmgg/${{ matrix.image }}:latest \
          ianmgg/${{ matrix.image }}:latest-amd64 \
          ianmgg/${{ matrix.image }}:latest-arm64

        docker buildx imagetools create \
          --tag ianmgg/${{ matrix.image }}:cli \
          ianmgg/${{ matrix.image }}:cli-amd64 \
          ianmgg/${{ matrix.image }}:cli-arm64

  # Build dev images on native runners (base images must be on Docker Hub first)
  build_dev:
    needs: merge_base_manifests
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
        dockerfile: [apache.dev, cli.dev]
        arch: [amd64, arm64]
        include:
          - php: '8.3'
            image: php83fpm
          - php: '8.5'
            image: php85fpm
          - dockerfile: apache.dev
            tag: dev
          - dockerfile: cli.dev
            tag: cli-dev
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    - name: Build and Push
      run: |
        docker buildx build . \
          --progress=plain \
          --platform linux/${{ matrix.arch }} \
          --file fpm/${{ matrix.php }}/Dockerfile.${{ matrix.dockerfile }} \
          --tag ianmgg/${{ matrix.image }}:${{ matrix.tag }}-${{ matrix.arch }} \
          --push

  # Merge dev arch tags into multi-arch manifests
  merge_dev_manifests:
    needs: build_dev
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: php83fpm
          - image: php85fpm
    steps:
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Create manifests
      run: |
        docker buildx imagetools create \
          --tag ianmgg/${{ matrix.image }}:dev \
          ianmgg/${{ matrix.image }}:dev-amd64 \
          ianmgg/${{ matrix.image }}:dev-arm64

        docker buildx imagetools create \
          --tag ianmgg/${{ matrix.image }}:cli-dev \
          ianmgg/${{ matrix.image }}:cli-dev-amd64 \
          ianmgg/${{ matrix.image }}:cli-dev-arm64
