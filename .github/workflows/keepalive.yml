name: Keepalive

# GitHub disables scheduled workflows after 60 days without repository
# activity, which silently stops the image rebuilds that pull in upstream
# PHP and Debian security updates.
#
# This workflow keeps the repo "active" by pushing an empty commit well
# inside that 60-day window, so the scheduled builds in docker-image.yml
# and docker-image-fpm.yml are never disabled.

on:
  schedule:
    # 03:00 UTC on the 1st of every month — comfortably inside the 60-day
    # window even if a month is skipped for any reason.
    - cron: "0 3 1 * *"
  workflow_dispatch:

# Avoid overlapping runs if a manual dispatch collides with the schedule.
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Push an empty commit to reset the inactivity timer
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # --allow-empty keeps this a no-op content-wise; [skip ci] stops the
        # commit from triggering any push-triggered workflows.
        git commit --allow-empty -m "chore: keepalive to prevent scheduled workflows being disabled [skip ci]"
        git push
